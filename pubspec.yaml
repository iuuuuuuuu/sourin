name: sourin_spike
# ⚠️ 包名里的 `spike` 是历史遗留 —— 它最初是「验证 Flutter + libmpv 能不能播 HEVC」
#    的一个 spike（见 `lib/main.dart` 的文件头）。spike 成功了，项目就在它上面长成了
#    完整客户端。改包名要动 100+ 处 import，收益为零，所以保留。
description: "源影 —— 跨端视频聚合客户端（Flutter + Rust）"
repository: https://github.com/sourin-app/sourin
homepage: https://github.com/sourin-app/sourin
issue_tracker: https://github.com/sourin-app/sourin/issues

# ★ `publish_to: none` —— 这不是一个 pub 包，是**应用**。
#   留着它防止误跑 `flutter pub publish`。
publish_to: 'none'

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.13.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # ═══════════════════════════════════════════════════════════════
  # media_kit —— 播放内核（2026-09-21 选型）
  # ═══════════════════════════════════════════════════════════════
  #
  # # 为什么是它
  #
  # 它封装 **libmpv**，而 libmpv 自带完整 FFmpeg —— 这正好绕开
  # 我们卡了一整天的问题：
  # ```text
  # WebView2/Edge 在 Windows 上走 Media Foundation 解码，
  # 而系统**没有注册 HEVC 解码器 MFT**（已实测：61 个 MFT 里零个 HEVC），
  # 所以 canPlayType('hvc1') 返回空。
  # libmpv 不用 Media Foundation，它自己带 FFmpeg 解码器。
  # ```
  #
  # # 已验证的事实（今天实测）
  #
  # ```text
  # · Windows  : mpv --gpu-api=opengl --gpu-context=angle --hwdec=d3d11va
  #              → "Using hardware decoding (d3d11va)"，CPU 0.06 核
  # · Android  : media_kit_libs_android_video 的 build.gradle 显示
  #              它下载 libmpv-android-video-build 的 jar（也是 libmpv）
  # · 体积     : libmpv-2.dll 28.39MB → LZMA2 压缩 8.33MB
  #              Android arm64 libmpv 只有 5.46MB
  # ```
  #
  # # 四个包各自的作用
  #
  # | 包 | 作用 |
  # |---|---|
  # | `media_kit` | 播放器 API（Player / open / play） |
  # | `media_kit_video` | 把画面渲染成 **Flutter 纹理**（这是关键） |
  # | `media_kit_libs_windows_video` | Windows 的原生库（libmpv-2.dll + ANGLE） |
  # | `media_kit_libs_android_video` | Android 的原生库（libmpv.so） |
  #
  # ⚠️ `media_kit_video` 用纹理而不是原生子窗口 ——
  #    这就是它没有 airspace 问题（视频能跟着页面滚动）的原因。
  #    我读过 media_kit_video_plugin.cc 全文确认：
  #    只有 texture id + rect，没有 SetParent / wid。
  media_kit: ^1.1.10
  media_kit_video: ^1.2.4
  media_kit_libs_windows_video: ^1.0.9
  media_kit_libs_android_video: ^1.3.6
  # ★ macOS 的原生库（libmpv + MoltenVK）。
  #
  # # 为什么它和上面两个一样是**直接依赖**而不是按平台条件引入
  # ```text
  # pubspec 没有「只在某平台装」的语法 —— `flutter pub get` 会装全部。
  # 这是 media_kit 官方推荐的用法（三个 libs 包并存），
  # 每个包只在**自己那个平台**参与构建（各自的 CMakeLists / podspec
  # 里带平台判定），不会把别家的二进制塞进你的产物。
  # ```
  # ⚠️ 漏了它的症状（macOS 上）：应用能起来，但一播放就报
  #    Failed to load dynamic library 'libmpv.dylib'。
  media_kit_libs_macos_video: ^1.1.4

  # 取流地址需要走 HTTP，且要能带自定义请求头（Referer 防盗链）
  http: ^1.2.2

  # ★ 校验更新安装包的 SHA-256（与 Release 里的 SHA256SUMS.txt 对账）。
  #   ⚠️ 它此前只是 forui 带进来的**传递依赖**（forui 已于 2026-10-09 移除，
  #   那一刻就会消失）—— 正因为如此必须显式声明，否则 import 会突然编不过
  #   （这正是 material_ui 那段注释记过的同一个坑）。
  #   版本沿用 pubspec.lock 里原有的 3.0.7，不新增任何下载。
  crypto: ^3.0.7

  # ═══════════════════════════════════════════════════════════════════════
  # ★★★ material_ui —— **必须显式声明**（2026-09-23，2026-10-09 移除 forui 后保留）
  # ═══════════════════════════════════════════════════════════════════════
  #
  # # 为什么会有这个包
  #
  # Flutter 3.47 把 Material 从 SDK 里**拆成了独立包** `material_ui`。
  # `package:flutter/material.dart` 仍然存在（同一个 SDK 里两份源码），
  # 于是**同一个 app 里可以同时存在两套 Material**。
  #
  # # 踩到的坑（实测，代价很大）
  #
  # 当时（引入 forui 之后）`shell.dart` 写的是：
  # ```dart
  # import 'package:material_ui/material_ui.dart';   // ← 只有这一个文件
  # ```
  # 其余 35 个 UI 文件全是：
  # ```dart
  # import 'package:flutter/material.dart';
  # ```
  #
  # 两套 `Theme` 是**不同的 InheritedWidget 类型**，互相看不见。
  # `flutter/material` 的 `Theme.of` 找不到祖先就走兜底亮色：
  # ```dart
  # return inheritedTheme?.theme.data ?? cupertinoTheme?.materialTheme
  #        ?? ThemeData.fallback();     // ← 亮色！
  # ```
  #
  # 症状（TV 截图实测像素，全部精确等于 Material 3 **亮色** baseline）：
  # ```text
  # 「设置」标题    (29,27,32)    = #1D1B20  亮色 onSurface     对比度 1.16:1 ✗
  # 源名正文        (73,69,79)    = #49454F  亮色 onSurfaceVariant
  # 卡片边框        (202,196,208) = #CAC4D0  亮色 outlineVariant
  # 开关 on         (103,80,164)  = #6750A4  亮色 primary
  # 卡片底色        (76,74,77)    = #E6E0E9@0.3 over #0A0A0A
  # ```
  # 深色背景上写深色字 —— 标题几乎看不见。
  #
  # ★ 最难发现的地方：**它不报错**。`Theme.of` 有兜底值，所以
  #   编译过、跑得起来、`flutter analyze` 0 error、单测全绿，
  #   只有**看截图量像素**才发现。
  #
  # 修法：全部统一到 `material_ui`（见 test/material_split_test.dart
  # 里那三个断言，①复现 ②修法 ③在真实壳里成立）。
  #
  # ⚠️ 为什么 pubspec 里必须**显式**写：本项目已经没有第二个 UI 包了，
  #    但如果哪天有人拖进一个依赖 `flutter/material` 的包，这个坑会
  #    原样重演。显式声明至少能让人在 `pub get` 时立刻看见这条依赖。
  material_ui: ^1.4.0

  # ★ 液态玻璃（用户 2026-09-24 要求「参考 github 开源项目，不要硬自己实现」）
  #
  # 选型理由（对比过 pub.dev 上 6 个同类包）：
  # ```text
  # ① **Material-free by design** —— 它**不依赖** flutter/material.dart，
  #    只依赖 flutter SDK 本身。我们没有这个顾虑的余地：
  #    Flutter 3.47 把 Material 拆成 material_ui 之后，任何拖进
  #    flutter/material 的包都会重演"两套 Theme 串台"那个 bug
  #    （详见 material_ui 那段注释 + test/material_split_test.dart）。
  # ② 零第三方运行时依赖（纯 Flutter SDK + 自带 GLSL shader）
  # ③ 平台覆盖：Windows(Impeller/ANGLE) / Android(Vulkan + GLES) 都在列表里
  # ④ MIT 许可
  # ⑤ 283 likes / 74.9k downloads / 160 pub points（社区验证充分）
  # ```
  # ⚠️ 它要求 Flutter ≥ 3.41.0，我们是 3.47.5 ✓
  liquid_glass_widgets: ^1.7.2

  # ★ 文件选择器（2026-09-24 加）
  #
  # # 为什么必须加
  # 原版是 Tauri，备份导入/导出、插件安装都用**原生文件对话框**
  #（	auri-plugin-dialog）。Flutter 侧没有内置等价物 ——
  # 不给的话用户只能手打文件路径，那是不可用的交互。
  #
  # # 选型
  # ile_selector 是 **Flutter 官方团队**（flutter/packages）维护的，
  # Windows/macOS/Linux 都有 endorsed 实现，加主包即可自动带上平台实现。
  # 体积预算充裕（Release 7z 才 24 MiB，硬指标 50 MB）。
  file_selector: ^1.0.3

  window_manager: ^0.5.2
  ffi: ^2.2.0
  path_provider: ^2.1.6

  # ★ m13655 (B)：还原窗口几何时要把它「夹」进显示器**工作区**（扣掉任务栏）。
  #   window_manager 只给窗口矩形，给不了显示器信息；显示器信息在 screen_retriever 里。
  #   ⚠️ 它本来就是 window_manager 的传递依赖（`pubspec.lock` 里已锁 0.2.2），
  #      这里只是提升为**直接依赖** —— 让 `import 'package:screen_retriever/...'`
  #      不触发 `depend_on_referenced_packages` lint，且不多下载任何包。
  screen_retriever: ^0.2.2
  tray_manager: 0.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^4.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # ★ 2026-10-08（Owner 第 8 条）：托盘图标。
  #
  # 与 `windows/runner/resources/app_icon.ico` **同一份字节** ——
  # 托盘和任务栏/开始菜单用同一张图，用户一眼能对上。
  # `tray_manager` 在 Windows 上按
  # `dirname(resolvedExecutable)/data/flutter_assets/<asset 相对路径>` 拼路径
  # （tray_manager-0.5.3/lib/src/tray_manager.dart:114-118）
  # ⇒ 必须走 assets 声明，不能直接传绝对路径。
  assets:
    - assets/tray.ico

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
